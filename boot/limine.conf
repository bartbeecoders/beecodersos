# BeeCodersOs boot menu (Limine)
# install.img is loaded with the kernel: it is what the `install` command
# writes to a disk (see the Makefile).
timeout: 3
verbose: no

/BeeCodersOs
    protocol: multiboot1
    path: boot():/boot/beecoders.elf
    module_path: boot():/boot/install.img

# The way back when the graphics screen stays black: the 80x25 text screen.
# Legacy BIOS boot only (UEFI has no text mode: there the kernel says so
# and uses the graphics mode after all).
/BeeCodersOs (text screen, legacy BIOS boot only)
    protocol: multiboot1
    path: boot():/boot/beecoders.elf
    module_path: boot():/boot/install.img
    textmode: yes
    cmdline: display=text

# The way back when the USB driver goes wrong (no keyboard, or a hang at
# boot): the kernel leaves the USB controller to the firmware.
/BeeCodersOs (without the USB driver)
    protocol: multiboot1
    path: boot():/boot/beecoders.elf
    module_path: boot():/boot/install.img
    cmdline: usb=off
