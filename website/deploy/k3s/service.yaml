# NodePort for the Cloudflare Tunnel: https://os.beecoders.com -> http://localhost:32120.
# scripts/deploy-k3s.sh sets nodePort from NODE_PORT.
apiVersion: v1
kind: Service
metadata:
  name: beecodersos-web
  labels: { app: beecodersos-web }
spec:
  type: NodePort
  selector: { app: beecodersos-web }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 32120
